  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"ce48d11a-9179-4a19-83c7-fba32606289d\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  :root{\n    --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif;\n    --accent:#7c3aed; --c1:#ffffff; --c2:#e7e7ee;\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0;height:100%;background:#050506}\n  ::-webkit-scrollbar{width:8px;height:8px}\n  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}\n  ::-webkit-scrollbar-track{background:transparent}\n\n  /* ---- imperative control classes (right panel) ---- */\n  .field{margin-bottom:13px}\n  .field>label{display:block;font-size:12px;color:#9a9aa2;margin-bottom:7px;font-weight:600}\n  .field input[type=text],.field textarea{\n    width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#f2f2f4;\n    border-radius:12px;padding:10px 14px;font-size:13.5px;font-family:var(--font)}\n  .field textarea{border-radius:14px;resize:vertical;min-height:60px;line-height:1.35}\n  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}\n  .seg{display:flex;gap:6px}\n  .seg button{flex:1;padding:9px 6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);\n    color:#9a9aa2;border-radius:12px;cursor:pointer;font-size:12.5px;font-weight:600;transition:.14s}\n  .seg button:hover{color:#fff;border-color:rgba(255,255,255,.22)}\n  .seg button.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.4)}\n  .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;\n    border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:14px;cursor:pointer;\n    font-size:13.5px;font-weight:600;color:#e8e8ec;transition:.14s;user-select:none}\n  .toggle:hover{border-color:rgba(255,255,255,.22)}\n  .toggle.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:#fff}\n  .switch{width:38px;height:22px;border-radius:999px;background:rgba(255,255,255,.16);position:relative;transition:.15s;flex-shrink:0}\n  .toggle.on .switch{background:var(--accent)}\n  .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}\n  .toggle.on .knob{left:18px}\n  .swatches{display:flex;gap:8px;flex-wrap:wrap}\n  .swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}\n  .swatch.active{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}\n  .section-label{font-size:11px;letter-spacing:1px;color:#77777f;text-transform:uppercase;margin:2px 0 12px;font-weight:700}\n  .divider{height:1px;background:rgba(255,255,255,.08);margin:16px 0}\n  .anim-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}\n  .anim-grid button{padding:8px 6px;font-size:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);\n    color:#9a9aa2;border-radius:11px;cursor:pointer;transition:.14s}\n  .anim-grid button:hover{color:#fff;border-color:rgba(255,255,255,.22)}\n  .anim-grid button.active{background:var(--accent);border-color:var(--accent);color:#fff}\n  .field input[type=range]{width:100%;accent-color:var(--accent)}\n  .field input[type=file]{font-size:12px;color:#9a9aa2}\n\n  /* ========== MOCKUP STYLES (injected preview) ========== */\n  .imsg-wrap{display:flex;width:100%;font-size:17px;line-height:1.32}\n  .imsg-wrap.sent{justify-content:flex-end}\n  .imsg-wrap.received{justify-content:flex-start}\n  .imsg{position:relative;max-width:75%;padding:8px 15px;border-radius:19px;word-wrap:break-word;white-space:pre-wrap;\n    font-family:-apple-system,\"SF Pro Text\",\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif}\n  .imsg.sent{background:#0b93f6 nge('Duración del efecto', a.hold, 1, 20, 0.5, v=>v.toFixed(1)+'s', v=>{a.hold=v;}));\n    } else if(this.isCountType()){\n      host.appendChild(this.ctlToggle('Contar desde 0 (el número sube)', a.count, v=>a.count=v, ()=>{ this.buildAnimControls(); this.playAnim(); }));\n      host.appendChild(this.ctlRange('Tiempo visible', a.hold, 0.2, 5, 0.1, v=>v.toFixed(1)+'s', v=>{a.hold=v;}));\n    } else {\n      host.appendChild(this.ctlRange('Tiempo visible', a.hold, 0, 5, 0.1, v=>v.toFixed(1)+'s', v=>{a.hold=v;}));\n    }\n    host.appendChild(div());\n    host.appendChild(this.ctlSelect('Formato de exportación', [['webm','Vídeo (WebM)'],['zip','Secuencia PNG (.zip)']], a.format, v=>{a.format=v;}));\n    host.appendChild(this.ctlSeg('FPS',[{label:'24',val:24},{label:'30',val:30},{label:'60',val:60}], a.fps, v=>{a.fps=v;}));\n    host.appendChild(this.ctlToggle('Repetir vista previa (bucle)', a.loop, v=>{a.loop=v;}, ()=>{ if(a.loop) this.playAnim(); }));\n    const hint=document.createElement('div'); hint.className='hint'; hint.style.cssText='font-size:12px;color:#9a9aa2;margin-top:4px';\n    hint.textContent='Para transparencia 100% fiable en DaVinci, usa Secuencia PNG.';\n    host.appendChild(hint);\n  }\n  loadImg(url){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; }); }\n  drawFrame(ctx,W,H,img,f,sc){\n    ctx.clearRect(0,0,W,H); ctx.save();\n    ctx.globalAlpha=Math.max(0,Math.min(1,f.opacity));\n    ctx.filter=f.blur>0.1?`blur(${f.blur*sc}px)`:'none';\n    ctx.translate(W/2+f.tx*sc, H/2+f.ty*sc);\n    ctx.rotate(f.rot*Math.PI/180); ctx.scale(f.scale,f.scale);\n    if(f.rotY) ctx.scale(Math.max(0.02,Math.cos(f.rotY*Math.PI/180)),1);\n    ctx.drawImage(img,-img.width/2,-img.height/2); ctx.restore();\n  }\n  makeRecorder(canvas,fps){\n    const stream=canvas.captureStream(fps); let mime='video/webm';\n    ['video/webm;codecs=vp9','video/webm;codecs=vp8'].forEach(m=>{ if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)) mime=m; });\n    const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000});\n    const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };\n    return {rec,chunks};\n  }\n  downloadBlob(chunks,name){\n    const blob=new Blob(chunks,{type:'video/webm'}); const url=URL.createObjectURL(blob);\n    const a=document.createElement('a'); a.download=name; a.href=url; a.click(); setTimeout(()=>URL.revokeObjectURL(url),3000);\n  }\n  async exportVideo(){\n    const inner=this.stage.firstElementChild; if(!inner){ alert('Nada que exportar'); return; }\n    if(this.needsDynamic()){ return this.exportVideoDynamic(); }\n    const lbl=this.dlBtn.querySelector('.lbl'); const prev=lbl.textContent; lbl.textContent='Renderizando…'; this.dlBtn.style.opacity='.6';\n    const sc=this.S.scale;\n    try{\n      this.resetAnimStyle();\n      const img=await this.loadImg(await window.htmlToImage.toPng(inner,{pixelRatio:sc,cacheBust:true}));\n      const pad=Math.round(90*sc); const W=img.width+pad*2, H=img.height+pad*2;\n      const canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H; const ctx=canvas.getContext('2d');\n      if(!canvas.captureStream){ alert('Tu navegador no soporta grabación. Usa Chrome/Edge.'); return; }\n      const {rec,chunks}=this.makeRecorder(canvas,this.S.anim.fps||30); const stopped=new Promise(r=>rec.onstop=r);\n      const {total}=this.timeline(); rec.start(); const start=performance.now();\n      await new Promise(res=>{ const step=(now)=>{ const t=now-start; this.drawFrame(ctx,W,H,img,this.frameAt(Math.min(t,total)).transform,sc); if(t<total+250) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });\n      rec.stop(); await stopped; this.downloadBlob(chunks, `mockup-${this.S.type}-anim.webm`);\n    }catch(err){ alert('Error al exportar vídeo: '+err.message); }\n    finally{ lbl.textContent=prev; this.dlBtn.style.opacity='1'; if(this.animActive()) this.playAnim(); }\n  }\n  async exportVideoDynamic(){\n    const inner=this.stage.firstElementChild;\n    const lbl=this.dlBtn.querySelector('.lbl'); const prev=lbl.textContent; this.dlBtn.style.opacity='.6';\n    const sc=this.S.scale; const fps=this.S.anim.fps||30; const {total}=this.timeline(); const N=Math.max(4,Math.round(total/1000*fps));\n    try{\n      this.resetAnimStyle();\n      const imgs=[], frs=[];\n      for(let i=0;i<=N;i++){\n        const t=(i/N)*total; const fr=this.frameAt(t);\n        lbl.textContent='Render '+Math.round(i/N*100)+'%';\n        this.applyContentFrame(inner, fr.contentP);\n        imgs.push(await this.loadImg(await window.htmlToImage.toPng(inner,{pixelRatio:sc,cacheBust:true})));\n        frs.push(fr.transform);\n      }\n      this.render();\n      let mw=0,mh=0; imgs.forEach(im=>{mw=Math.max(mw,im.width);mh=Math.max(mh,im.height);});\n      const pad=Math.round(90*sc); const W=mw+pad*2, H=mh+pad*2;\n      const canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H; const ctx=canvas.getContext('2d');\n      if(!canvas.captureStream){ alert('Tu navegador no soporta grabación. Usa Chrome/Edge.'); return; }\n      const {rec,chunks}=this.makeRecorder(canvas,fps); const stopped=new Promise(r=>rec.onstop=r);\n      lbl.textContent='Grabando…'; rec.start();\n      for(let i=0;i<=N;i++){ this.drawFrame(ctx,W,H,imgs[i],frs[i],sc); await this.sleep(1000/fps); }\n      await this.sleep(300); rec.stop(); await stopped; this.downloadBlob(chunks, `mockup-${this.S.type}-anim.webm`);\n    }catch(err){ alert('Error al exportar vídeo: '+err.message); }\n    finally{ this.render(); lbl.textContent=prev; this.dlBtn.style.opacity='1'; this.updateAnimUI(); if(this.animActive()) this.playAnim(); }\n  }\n  async exportZip(){\n    const inner=this.stage.firstElementChild; if(!inner){ alert('Nada que exportar'); return; }\n    if(!window.JSZip){ alert('Librería ZIP no cargada'); return; }\n    const lbl=this.dlBtn.querySelector('.lbl'); const prev=lbl.textContent; this.dlBtn.style.opacity='.6';\n    const sc=this.S.scale; const fps=this.S.anim.fps||30; const {total}=this.timeline(); const N=Math.max(2,Math.round(total/1000*fps));\n    try{\n      this.resetAnimStyle();\n      const dyn=this.needsDynamic(); const baseImgs=[], frs=[];\n      if(dyn){\n        for(let i=0;i<=N;i++){ const t=(i/N)*total; const fr=this.frameAt(t); lbl.textContent='Render '+Math.round(i/N*100)+'%';\n          this.applyContentFrame(inner,fr.contentP);\n          baseImgs.push(await this.loadImg(await window.htmlToImage.toPng(inner,{pixelRatio:sc,cacheBust:true}))); frs.push(fr.transform); }\n        this.render();\n      } else {\n        const img=await this.loadImg(await window.htmlToImage.toPng(inner,{pixelRatio:sc,cacheBust:true}));\n        for(let i=0;i<=N;i++){ baseImgs.push(img); frs.push(this.frameAt((i/N)*total).transform); }\n      }\n      let mw=0,mh=0; baseImgs.forEach(im=>{mw=Math.max(mw,im.width);mh=Math.max(mh,im.height);});\n      const pad=Math.round(90*sc); const W=mw+pad*2, H=mh+pad*2;\n      const zip=new window.JSZip();\n      const canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H; const ctx=canvas.getContext('2d');\n      for(let i=0;i<=N;i++){ lbl.textContent='Empaquetando '+Math.round(i/N*100)+'%';\n        this.drawFrame(ctx,W,H,baseImgs[i],frs[i],sc);\n        const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));\n        zip.file(`frame_${String(i).padStart(4,'0')}.png`, blob);\n      }\n      zip.file('LEEME.txt', `Secuencia de imágenes PNG con transparencia.\\nFPS: ${fps}\\nFrames: ${N+1}\\n\\nEn DaVinci Resolve: Media Pool > clic derecho > \"Add as Image Sequence\" (o importa la carpeta). Ajusta la duración del clip al FPS indicado.`);\n      lbl.textContent='Comprimiendo…';\n      const out=await zip.generateAsync({type:'blob'});\n      const url=URL.createObjectURL(out);\n      const a=document.createElement('a'); a.download=`mockup-${this.S.type}-seq-${fps}fps.zip`; a.href=url; a.click(); setTimeout(()=>URL.revokeObjectURL(url),4000);\n    }catch(err){ alert('Error al exportar secuencia: '+err.message); }\n    finally{ this.render(); lbl.textContent=prev; this.dlBtn.style.opacity='1'; this.updateAnimUI(); if(this.animActive()&&this.S.anim.loop) this.playAnim(); }\n  }\n  toggleChecker(){\n    this.S.themeManual=true;\n    const root=this.root; const dark = root.style.getPropertyValue('--c1').trim()==='#17171a';\n    if(dark){ root.style.setProperty('--c1','#ffffff'); root.style.setProperty('--c2','#e7e7ee'); }\n    else{ root.style.setProperty('--c1','#17171a'); root.style.setProperty('--c2','#0e0e10'); }\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
